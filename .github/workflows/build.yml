name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Commit APK into repo
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/nightticker.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add release/nightticker.apk
          git commit -m "build: nightticker.apk" || exit 0
          git push
